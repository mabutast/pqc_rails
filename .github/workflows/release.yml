name: Release gem

on:
  push:
    tags:
      - "v*"

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Vendor liboqs source into the gem package
        run: bundle exec rake vendor:liboqs

      - uses: rubygems/release-gem@v1
        with:
          # [EXPERIMENTAL] sigstore attestation signing. Disabled: its RUBYOPT-injected
          # `require "rubygems/commands/push_command"` activates Ruby's bundled default
          # openssl gem before `bundle exec rake release` runs, which then conflicts with
          # Gemfile.lock's pinned newer openssl (needed for Ruby 3.2 compatibility) —
          # "you have already activated openssl X, but your Gemfile requires openssl Y".
          attestations: false
