name: Release gem

on:
  push:
    tags:
      - "v*"

jobs:
  # ビルド済みのliboqsを同梱したプラットフォーム別のgemを作り、コンパイラの無い環境で確かめる
  native:
    uses: ./.github/workflows/native-gems.yml

  push:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Vendor liboqs source into the gem package
        run: bundle exec rake vendor:liboqs

      - uses: rubygems/release-gem@v1
        with:
          # [EXPERIMENTAL] sigstore attestation signing. Disabled: its RUBYOPT-injected
          # `require "rubygems/commands/push_command"` activates Ruby's bundled default
          # openssl gem before `bundle exec rake release` runs, which then conflicts with
          # Gemfile.lock's pinned newer openssl —
          # "you have already activated openssl X, but your Gemfile requires openssl Y".
          attestations: false

      # release-gem が設定した RubyGems.org の認証情報で、プラットフォーム別のgemも公開する
      - uses: actions/download-artifact@v4
        with:
          name: native-gems
          path: native-gems

      - name: Push the platform gems
        run: |
          for gem in native-gems/*.gem; do
            gem push "$gem"
          done
