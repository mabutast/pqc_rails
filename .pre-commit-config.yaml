repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: local
    hooks:
      - id: check-public-docs
        name: Check public docs for internal-process leakage
        description: >-
          Warns (does not block) when README.md/CHANGELOG.md/NOTICE.md/LICENSE.txt/docs/*.md
          carry internal development-process traces: dates used for pqc_rails' own state
          instead of version numbers, self-referential "as of when this was written"
          phrasing, Phase/Step milestone terminology, references to local-only or
          gitignored paths, or maintainer decision-narrative. See .claude/CLAUDE.md
          「README文体方針」for the judgment criteria.
        entry: bin/check_public_docs
        language: script
        always_run: true
        pass_filenames: false
        verbose: true
